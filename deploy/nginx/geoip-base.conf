# Included from both the stream and http contexts.
geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
    auto_reload 5m;
    $geoip2_country_code country iso_code;
}

geo $is_private {
    default 0;
    0.0.0.0/8        1;
    10.0.0.0/8       1;
    127.0.0.0/8      1;
    169.254.0.0/16   1;
    172.16.0.0/12    1;
    192.168.0.0/16   1;
    ::1/128          1;
    fc00::/7         1;
    fe80::/10        1;
}

include /etc/nginx/country-allow.conf;

map "$is_private:$country_allowed" $access_allowed {
    default 0;
    "~^1:"  1;
    "~^0:1$" 1;
}
