include /etc/nginx/modules/*.conf;

user nginx;
worker_processes auto;
pcre_jit on;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    log_format stream_geo '$time_iso8601 client=$remote_addr '
                          'country="$geoip2_country_code" private=$is_private allowed=$access_allowed '
                          'status=$status bytes=$bytes_sent session=$session_time';
    access_log /var/log/nginx/stream.log stream_geo;

    limit_conn_zone $binary_remote_addr zone=stream_conn:16m;

    include /etc/nginx/geoip-base.conf;

    map $access_allowed $stream_backend {
        1       127.0.0.1:8443;
        default 127.0.0.1:9444;
    }

    server {
        listen 443 reuseport;
        limit_conn stream_conn 30;
        proxy_pass $stream_backend;
        proxy_protocol on;
        proxy_timeout 3600s;
        proxy_connect_timeout 5s;
    }

    # Countries outside the allow list are closed here, before TLS.
    server {
        listen 127.0.0.1:9444;
        return "";
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    client_max_body_size 0;
    __RESOLVER__

    limit_req_zone $binary_remote_addr zone=http_req:16m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=http_conn:16m;
    limit_req_status 429;
    limit_conn_status 429;

    include /etc/nginx/geoip-base.conf;

    log_format mtls '$time_iso8601 client=$remote_addr '
                    'country="$geoip2_country_code" private=$is_private '
                    'cn="$ssl_client_cn" dn="$ssl_client_s_dn" '
                    'serial=$ssl_client_serial verify=$ssl_client_verify '
                    'method=$request_method uri="$request_uri" status=$status '
                    'bytes=$body_bytes_sent ua="$http_user_agent"';
    access_log /var/log/nginx/access.log mtls;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # nginx has the full subject DN, not a separate CN variable.
    map $ssl_client_s_dn $ssl_client_cn {
        default "-";
        "~CN=(?<cn>[^,/]+)" $cn;
    }

    server {
        listen 80;
        # No TLS on :80. Still drop non-KR/JP public clients.
        if ($access_allowed = 0) {
            return 444;
        }
        return 301 https://$host$request_uri;
    }

    server {
        # Reachable only through the stream listener, which already applied geo.
        listen 127.0.0.1:8443 ssl proxy_protocol;
        # listen proxy_protocol fills $proxy_protocol_addr. real_ip copies it
        # into $remote_addr so logs and the HTTP GeoIP lookup see the client.
        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;
        server_name _;

        ssl_certificate           /etc/nginx/mtls/server/server.crt;
        ssl_certificate_key       /etc/nginx/mtls/server/server.key;
        ssl_client_certificate    /etc/nginx/mtls/ca/ca.crt;
        ssl_crl                   /etc/nginx/mtls/crl/ca.crl;
        ssl_verify_client on;
        ssl_verify_depth 2;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;

        limit_req zone=http_req burst=200 nodelay;
        limit_conn http_conn 30;

        client_header_timeout 15s;
        client_body_timeout 300s;
        send_timeout 3600s;

        location / {
            set $webtop_upstream __WEBTOP_UPSTREAM__;
            proxy_pass http://$webtop_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
