include /etc/nginx/modules/*.conf;

user nginx;
worker_processes auto;
pcre_jit on;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    log_format stream_geo '$time_iso8601 client=$remote_addr '
                          'country="$geoip2_country_code" private=$is_private allowed=$access_allowed '
                          'status=$status bytes=$bytes_sent session=$session_time';
    access_log /var/log/nginx/stream.log stream_geo buffer=16k flush=1s;

    limit_conn_zone $binary_remote_addr zone=stream_conn:16m;

    include /etc/nginx/geoip-base.conf;

    map $access_allowed $stream_backend {
        1       127.0.0.1:8443;
        default 127.0.0.1:9444;
    }

    server {
        listen 443 reuseport;
        limit_conn stream_conn 30;
        proxy_pass $stream_backend;
        proxy_protocol on;
        proxy_timeout 3600s;
        proxy_connect_timeout 5s;
    }

    # Countries outside the allow list are closed here, before TLS.
    server {
        listen 127.0.0.1:9444;
        return "";
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    client_max_body_size 0;
    __RESOLVER__

    limit_req_zone $binary_remote_addr zone=http_req:16m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=enroll_req:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=http_conn:16m;
    limit_req_status 429;
    limit_conn_status 429;

    include /etc/nginx/geoip-base.conf;

    # Bearer secrets live in the path. Log a redacted URI, never the token or
    # one-time download id. error_log stays at warn, which does not record URIs.
    map $request_uri $logged_uri {
        default                         $request_uri;
        ~^/enroll/dl/                   /enroll/dl/;
        ~^/admin/dl/                    /admin/dl/;
        ~^/enroll/[^?\s]+/ca\.cer       /enroll/ca.cer;
        ~^/enroll/[^?\s]+/ca\.crt       /enroll/ca.crt;
        ~^/enroll/[^?\s]+               /enroll/;
    }

    log_format mtls '$time_iso8601 client=$remote_addr '
                    'country="$geoip2_country_code" private=$is_private '
                    'cn="$ssl_client_cn" dn="$ssl_client_s_dn" '
                    'serial=$ssl_client_serial verify=$ssl_client_verify '
                    'method=$request_method uri="$logged_uri" status=$status '
                    'bytes=$body_bytes_sent ua="$http_user_agent"';
    access_log /var/log/nginx/access.log mtls;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # nginx has the full subject DN, not a separate CN variable.
    map $ssl_client_s_dn $ssl_client_cn {
        default "-";
        "~CN=(?<cn>[^,/]+)" $cn;
    }

    include /etc/nginx/admin-cn.conf;

    map $ssl_client_s_dn $ou_is_admin {
        default 0;
        ~*OU=admin 1;
    }
    map "$ou_is_admin:$cn_is_admin" $is_admin {
        default 0;
        ~1 1;
    }

    # HTTP_SERVER_BEGIN
    server {
        listen __HTTP_PORT__;
        # No TLS here. Still drop non-KR/JP public clients before the redirect.
        if ($access_allowed = 0) {
            return 444;
        }
        __HTTPS_REDIRECT__
    }
    # HTTP_SERVER_END

    server {
        # Reachable only through the stream listener, which already applied geo.
        listen 127.0.0.1:8443 ssl proxy_protocol;
        # listen proxy_protocol fills $proxy_protocol_addr. real_ip copies it
        # into $remote_addr so logs and the HTTP GeoIP lookup see the client.
        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;
        server_name _;

        ssl_certificate           /etc/nginx/mtls/server/server.crt;
        ssl_certificate_key       /etc/nginx/mtls/server/server.key;
        ssl_client_certificate    /etc/nginx/mtls/ca/ca.crt;
        ssl_crl                   /etc/nginx/mtls/crl/ca.crl;
        # optional so /enroll/ can proceed without a certificate. Locations
        # that need a certificate reject anything but SUCCESS.
        ssl_verify_client optional;
        ssl_verify_depth 2;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;

        limit_req zone=http_req burst=200 nodelay;
        limit_conn http_conn 30;

        client_header_timeout 15s;
        client_body_timeout 300s;
        send_timeout 3600s;

        location /enroll/ {
            limit_req zone=enroll_req burst=10 nodelay;
            proxy_pass http://certadmin:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Country $geoip2_country_code;
            proxy_set_header X-Client-Verify $ssl_client_verify;
            proxy_set_header X-Client-DN $ssl_client_s_dn;
            proxy_set_header X-Client-CN $ssl_client_cn;
            proxy_set_header X-Client-Serial $ssl_client_serial;
            proxy_set_header X-Certadmin-Auth "__CERTADMIN_SECRET__";
            proxy_read_timeout 60s;
        }

        location /admin/ {
            set $admin_deny "";
            if ($ssl_client_verify != SUCCESS) { set $admin_deny V; }
            if ($is_admin = 0) { set $admin_deny "${admin_deny}A"; }
            if ($admin_deny != "") { return 403; }
            proxy_pass http://certadmin:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Country $geoip2_country_code;
            proxy_set_header X-Client-Verify $ssl_client_verify;
            proxy_set_header X-Client-DN $ssl_client_s_dn;
            proxy_set_header X-Client-CN $ssl_client_cn;
            proxy_set_header X-Client-Serial $ssl_client_serial;
            proxy_set_header X-Certadmin-Auth "__CERTADMIN_SECRET__";
            proxy_read_timeout 60s;
        }

        location = /admin {
            return 301 /admin/;
        }

        # FileBrowser Quantum lives at /fi/. /files/ is the KasmVNC kclient
        # file manager and must stay on the webtop upstream (location /).
        # A variable upstream lets nginx start while the compose profile is off.
        location = /fi {
            set $fi_need_cert "";
            if ($ssl_client_verify != SUCCESS) { set $fi_need_cert 1; }
            if ($fi_need_cert = 1) { return 403; }
            return 301 /fi/;
        }

        location /fi/ {
            set $fi_need_cert "";
            if ($ssl_client_verify != SUCCESS) { set $fi_need_cert 1; }
            if ($fi_need_cert = 1) { return 403; }
            set $filebrowser_upstream __FILEBROWSER_UPSTREAM__;
            client_max_body_size 0;
            proxy_pass http://$filebrowser_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
        }

        # Selkies and KasmVNC both sit behind this one upstream (port 3000).
        # KasmVNC websockets are /websockify and socket.io audio is /audio/.
        # The container's own nginx routes those paths; this proxy must keep
        # the upgrade headers and must not buffer the stream.
        location / {
            set $need_cert "";
            if ($ssl_client_verify != SUCCESS) { set $need_cert 1; }
            if ($need_cert = 1) { return 403; }
            set $webtop_upstream __WEBTOP_UPSTREAM__;
            proxy_pass http://$webtop_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
