# Webtop plus an mTLS Nginx front end.
# Nginx uses the host network so it sees the visitor's real IP. Docker's
# userland proxy would otherwise show 172.17.0.1 and the private-range allow
# would let every country through. Webtop and certadmin stay on the bridge
# and are published only on 127.0.0.1 for Nginx.
#
#   cp deploy/.env.example deploy/.env   # MaxMind account id and license key
#   ./scripts/gen-certs.sh init
#   ./scripts/gen-certs.sh server --cn webtop.example.com --san DNS:webtop.example.com,DNS:localhost,IP:127.0.0.1
#   ./scripts/gen-certs.sh client laptop
#   docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d

name: webtop

services:
  webtop:
    image: ghcr.io/krsuhjunho/webtop:latest
    container_name: webtop
    restart: unless-stopped
    shm_size: "2gb"
    security_opt:
      - seccomp:unconfined
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Tokyo}
      LANG: ${LANG:-ko_KR.UTF-8}
      LANGUAGE: ${LANGUAGE:-ko_KR:ko:ja_JP:ja:en}
      LC_ALL: ${LC_ALL:-ko_KR.UTF-8}
      TITLE: ${TITLE:-Webtop}
    ports:
      # Loopback only. Nginx on the host network proxies to this.
      - "127.0.0.1:${WEBTOP_LOCAL_PORT:-33000}:3000"
    volumes:
      - webtop-config:/config
      # Host Docker socket, optional. The image ships the CLI and compose plugin only.
      # - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - webtop

  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate
    container_name: webtop-geoipupdate
    restart: unless-stopped
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID:?set MAXMIND_ACCOUNT_ID in deploy/.env}
      GEOIPUPDATE_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:?set MAXMIND_LICENSE_KEY in deploy/.env}
      GEOIPUPDATE_EDITION_IDS: GeoLite2-Country
      GEOIPUPDATE_FREQUENCY: ${GEOIPUPDATE_FREQUENCY:-72}
    volumes:
      - webtop-geoip:/usr/share/GeoIP

  certadmin:
    build: ./certadmin
    image: webtop-certadmin:local
    container_name: webtop-certadmin
    restart: unless-stopped
    environment:
      CERT_DIR: /certs
      LOG_PATH: /logs/certadmin.log
      ADMIN_CNS: ${ADMIN_CNS:-}
      CERTADMIN_PROXY_SECRET: ${CERTADMIN_PROXY_SECRET:?set CERTADMIN_PROXY_SECRET in deploy/.env}
      ENROLL_TTL_SECONDS: ${ENROLL_TTL_SECONDS:-600}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - "127.0.0.1:${CERTADMIN_LOCAL_PORT:-18080}:8080"
    volumes:
      - ./certs:/certs
      - ./logs:/logs
    networks:
      - webtop

  nginx:
    build: ./nginx
    image: webtop-nginx:local
    container_name: webtop-nginx
    restart: unless-stopped
    depends_on:
      - webtop
      - geoipupdate
      - certadmin
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      ALLOWED_COUNTRIES: ${ALLOWED_COUNTRIES:-KR,JP}
      ADMIN_CNS: ${ADMIN_CNS:-}
      CERTADMIN_PROXY_SECRET: ${CERTADMIN_PROXY_SECRET:?set CERTADMIN_PROXY_SECRET in deploy/.env}
      WEBTOP_UPSTREAM: 127.0.0.1:${WEBTOP_LOCAL_PORT:-33000}
      CERTADMIN_UPSTREAM: 127.0.0.1:${CERTADMIN_LOCAL_PORT:-18080}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      HTTP_PORT: ${HTTP_PORT:-}
      REQUIRE_HOST_NETWORK: "1"
    network_mode: host
    volumes:
      - ./certs/ca/ca.crt:/etc/nginx/mtls/ca/ca.crt:ro
      - ./certs/server:/etc/nginx/mtls/server:ro
      - ./certs/crl:/etc/nginx/mtls/crl:ro
      - ./logs:/var/log/nginx
      - webtop-geoip:/usr/share/GeoIP:ro

networks:
  webtop:

volumes:
  webtop-config:
  webtop-geoip:
